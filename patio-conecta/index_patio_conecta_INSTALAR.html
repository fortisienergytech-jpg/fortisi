<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b168d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Patio Conecta"><title>Patio Conecta</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="icon" href="./icons/icon-32.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#f6f3f8;color:#27172f}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(720px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 18px 55px #3c194b24}.head{display:flex;align-items:center;gap:18px;margin-bottom:22px}.head img{width:86px;height:86px;border-radius:20px;object-fit:cover}h1{margin:0;color:#5b168d;font-size:31px}.sub{margin:5px 0;color:#746b79}label{font-size:14px;font-weight:700;display:block;margin:13px 0 6px}input{width:100%;padding:14px;border:1px solid #d8cddd;border-radius:12px;font-size:16px}button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}.login{margin-top:18px;background:#5b168d;color:white}.open{background:#ef3340;color:white;margin:18px 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.install{background:#f2eaf6;color:#5b168d;border:1px solid #e2d3e9}h2{font-size:20px;margin:12px 0 7px}.intro{color:#5f5664;line-height:1.5}.hidden{display:none!important}.error{display:none;color:#b42318;margin-top:10px}.error.show{display:block}.help{display:none;margin-top:16px;padding:16px;background:#faf8fb;border-radius:14px;line-height:1.55}.help.show{display:block}.help li{margin:7px 0}.back{margin-top:14px;background:#fff;color:#5b168d;border:1px solid #d9cce0}@media(max-width:560px){.card{padding:22px 18px}.grid{grid-template-columns:1fr}.head img{width:70px;height:70px}h1{font-size:27px}}</style></head><body><div class="wrap">
<section id="login" class="card"><div class="head"><img src="./icons/icon-192.png" alt="Patio Conecta"><div><h1>Ingreso Operadores</h1><p class="sub">Patio Conecta</p></div></div><p class="intro">Ingresa los datos de tu local para acceder.</p><form id="form"><label>Local</label><input id="local" placeholder="Nombre del local" required><label>Clave</label><input id="clave" type="password" placeholder="Clave" required><button class="login">Ingresar</button><div id="error" class="error">Local o clave incorrectos.</div></form></section>
<section id="portal" class="card hidden"><div class="head"><img src="./icons/icon-192.png" alt="Patio Conecta"><div><h1>Patio Conecta</h1><p class="sub">Acceso Operadores · Santiago</p></div></div><a class="btn open" href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec">Abrir Patio Conecta</a><h2>Instalar Patio Conecta</h2><p class="intro">Elige el dispositivo donde quieres instalar Patio Conecta.</p><div class="grid"><button class="install" data-os="windows">💻 Instalar en Windows</button><button class="install" data-os="mac">🍎 Instalar en Mac</button><button class="install" data-os="android">🤖 Instalar en Android</button><button class="install" data-os="ios">📱 Instalar en iPhone / iPad</button></div><div id="help" class="help"></div><button id="logout" class="back">Volver al ingreso</button></section></div>
<script>let dp=null;const q=x=>document.querySelector(x),login=q('#login'),portal=q('#portal'),help=q('#help');q('#form').onsubmit=e=>{e.preventDefault();if(q('#local').value.trim().toLowerCase()==='santiago'&&q('#clave').value.trim().toLowerCase()==='santiago'){q('#error').classList.remove('show');login.classList.add('hidden');portal.classList.remove('hidden')}else q('#error').classList.add('show')};q('#logout').onclick=()=>{portal.classList.add('hidden');login.classList.remove('hidden');help.classList.remove('show')};addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});async function install(f){if(dp){dp.prompt();await dp.userChoice;dp=null}else{help.innerHTML=f;help.classList.add('show');help.scrollIntoView({behavior:'smooth'})}}document.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>{let o=b.dataset.os;if(o==='windows')install('<strong>PC / Windows</strong><ol><li>Abre esta página en Chrome o Edge.</li><li>Chrome: menú <strong>⋮</strong> → <strong>Transmitir, guardar y compartir</strong> → <strong>Instalar página como app</strong>.</li><li>Confirma <strong>Instalar</strong>.</li></ol>');if(o==='mac')install('<strong>Mac</strong><ol><li>Chrome/Edge: selecciona <strong>Instalar página como app</strong>.</li><li>Safari compatible: <strong>Archivo → Agregar al Dock</strong>.</li></ol>');if(o==='android')install('<strong>Android</strong><ol><li>Abre esta página en Chrome.</li><li>Menú <strong>⋮</strong> → <strong>Instalar app</strong> o <strong>Agregar a pantalla principal</strong>.</li><li>Confirma.</li></ol>');if(o==='ios'){help.innerHTML='<strong>iPhone / iPad</strong><ol><li>Abre esta página en <strong>Safari</strong>.</li><li>Toca <strong>Compartir</strong>.</li><li><strong>Agregar a pantalla de inicio</strong>.</li><li>Toca <strong>Agregar</strong>.</li></ol>';help.classList.add('show');help.scrollIntoView({behavior:'smooth'})}});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
