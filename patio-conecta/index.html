<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b168d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Patio Conecta">
  <title>Patio Conecta</title>
  <script>
    (function(){
      const APP_URL = 'https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec?authuser=0';
      const params = new URLSearchParams(window.location.search);
      const launchedAsInstalledApp =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true ||
        params.get('source') === 'pwa';

      if (launchedAsInstalledApp) {
        window.location.replace(APP_URL);
      }
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">


  <style>
    :root{
      --purple:#5b168d;
      --red:#ef3340;
      --orange:#f5a623;
      --ink:#211824;
      --muted:#756c79;
      --line:#ece6ef;
      --soft:#faf8fb;
      --white:#fff;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}

    body{
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.95),rgba(255,255,255,0) 38%),
        linear-gradient(180deg,#fbfafc 0%,#f4f0f6 100%);
    }

    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(680px,100%);
      background:rgba(255,255,255,.98);
      border:1px solid rgba(91,22,141,.08);
      border-radius:26px;
      padding:30px;
      box-shadow:0 18px 45px rgba(54,25,64,.10);
      position:relative;
      overflow:hidden;
    }

    .card:before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;
      height:4px;
      background:linear-gradient(90deg,var(--red) 0 38%,var(--orange) 38% 50%,var(--purple) 50% 100%);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      margin:2px 0 24px;
    }

    .brand img{
      width:62px;
      height:62px;
      object-fit:contain;
      border-radius:16px;
      background:#fff;
    }

    .eyebrow{
      display:inline-flex;
      padding:5px 9px;
      border-radius:999px;
      background:#f3edf7;
      color:var(--purple);
      font-size:10px;
      font-weight:800;
      letter-spacing:.07em;
      text-transform:uppercase;
      margin-bottom:6px;
    }

    h1{
      margin:0;
      color:var(--purple);
      font-size:29px;
      line-height:1.05;
      letter-spacing:-.025em;
    }

    .sub{
      margin:5px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .intro{
      margin-bottom:18px;
    }

    .intro h2{
      margin:0 0 5px;
      font-size:21px;
      letter-spacing:-.015em;
      color:var(--ink);
    }

    .lead{
      margin:0;
      color:#675e6a;
      font-size:14px;
      line-height:1.5;
    }

    .choice-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:18px;
    }

    .choice{
      min-height:116px;
      border-radius:18px;
      padding:16px;
      display:flex;
      align-items:center;
      gap:13px;
      text-align:left;
      cursor:pointer;
      text-decoration:none;
      transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
    }

    .choice:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 24px rgba(47,24,55,.08);
    }

    .choice.web{
      background:#fff;
      border:1px solid #eadfe7;
      color:var(--ink);
    }

    .choice.install{
      background:var(--purple);
      border:1px solid var(--purple);
      color:#fff;
      box-shadow:0 8px 18px rgba(91,22,141,.15);
    }

    .choice-icon{
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      background:#f8f3fa;
      color:var(--purple);
    }

    .choice.install .choice-icon{
      background:rgba(255,255,255,.14);
      color:#fff;
    }

    .choice-icon svg{
      width:21px;
      height:21px;
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .choice-copy{
      margin:0;
      min-width:0;
    }

    .choice strong{
      display:block;
      font-size:16px;
      margin-bottom:4px;
      letter-spacing:-.01em;
    }

    .choice small{
      display:block;
      font-size:12px;
      line-height:1.4;
      opacity:.78;
    }

    .actions{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .primary,.secondary,.browser-action,.open-now{
      width:100%;
      border-radius:12px;
      padding:12px 14px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }

    .primary{
      border:0;
      background:var(--purple);
      color:white;
    }

    .secondary,.browser-action{
      border:1px solid #e2d8e5;
      background:#fff;
      color:var(--purple);
    }

    .open-now{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border:0;
      background:var(--red);
      color:#fff;
      text-decoration:none;
      margin-top:10px;
    }

    .hidden{display:none!important}

    .status{
      margin-top:14px;
      padding:14px;
      border-radius:15px;
      background:var(--soft);
      border:1px solid var(--line);
      line-height:1.5;
      color:#564c59;
      font-size:13px;
    }

    .status strong{color:var(--purple)}

    .small{
      font-size:11px;
      color:#978d9a;
      margin-top:16px;
      text-align:center;
    }

    .install-guide{display:grid;gap:10px}
    .install-detected{
      display:inline-flex;
      width:max-content;
      max-width:100%;
      padding:5px 8px;
      border-radius:999px;
      background:#f0e8f5;
      color:var(--purple);
      font-size:11px;
      font-weight:800;
    }
    .install-title{font-size:16px;font-weight:800;color:var(--ink)}
    .install-steps{display:grid;gap:8px}
    .install-step{
      display:grid;
      grid-template-columns:28px 1fr;
      gap:9px;
      align-items:start;
      padding:9px 10px;
      border-radius:11px;
      background:#fff;
      border:1px solid var(--line);
    }
    .install-step-num{
      width:28px;height:28px;border-radius:50%;
      display:grid;place-items:center;
      background:var(--purple);color:#fff;
      font-size:12px;font-weight:800;
    }
    .install-step div:last-child{padding-top:4px;font-size:13px;color:#4f4554}
    .install-note{font-size:11px;color:#7d7282}

    .share-icon{display:inline-flex;vertical-align:-4px;margin:0 3px}
    .share-icon svg{width:20px;height:20px;display:block;stroke:currentColor}
    .install-browser-icon{display:inline-flex;vertical-align:-6px;margin:0 5px;padding:3px;border:1px solid #ded3e4;border-radius:7px;background:#fff;color:#291632}
    .install-browser-icon svg{width:24px;height:24px;display:block;stroke:currentColor}
    .browser-actions{display:grid;gap:8px;margin-top:10px}

    .installed-box{display:grid;gap:10px}
    .installed-head{display:flex;gap:11px;align-items:flex-start}
    .installed-check{
      flex:0 0 auto;
      width:38px;height:38px;border-radius:50%;
      display:grid;place-items:center;
      background:#edf8f2;color:#18794e;
      font-weight:900;font-size:19px;
    }
    .installed-head h3{margin:0 0 3px;color:var(--purple);font-size:17px}
    .installed-head p{margin:0;color:#625866;font-size:13px;line-height:1.4}
    .launch-hint{
      padding:10px 11px;border-radius:11px;background:#fff;border:1px solid var(--line);
      font-size:12px;color:#504653;line-height:1.45
    }

    @media(max-width:600px){
      .wrap{padding:14px}
      .card{padding:22px 16px;border-radius:22px}
      .brand img{width:56px;height:56px}
      h1{font-size:25px}
      .intro h2{font-size:19px}
      .choice-grid{grid-template-columns:1fr}
      .choice{min-height:94px}
    }
  </style>


</head>
<body>
<div class="wrap">

<section id="portalCard" class="card">
  <div class="brand">
    <img src="./icons/icon-192.png" alt="Patio Conecta">
    <div>
      <span class="eyebrow">Acceso Operadores</span>
      <h1>Patio Conecta</h1>
      <p class="sub">Patio Bellavista · Santiago</p>
    </div>
  </div>

  <div class="intro">
    <h2>¿Cómo quieres ingresar?</h2>
    <p class="lead">Elige cómo quieres abrir Patio Conecta.</p>
  </div>

  <div class="choice-grid">
    <a class="choice web" href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec?authuser=0">
      <span class="choice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="14" rx="2"></rect>
          <path d="M8 21h8"></path>
          <path d="M12 18v3"></path>
        </svg>
      </span>
      <span class="choice-copy">
        <strong>Continuar en la web</strong>
        <small>Abre Patio Conecta en este navegador.</small>
      </span>
    </a>

    <button id="installChoiceBtn" class="choice install" type="button">
      <span class="choice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v12"></path>
          <path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path>
          <path d="M5 20h14"></path>
        </svg>
      </span>
      <span class="choice-copy">
        <strong>Instalar Patio Conecta</strong>
        <small>Acceso directo desde tu equipo o teléfono.</small>
      </span>
    </button>
  </div>

  <div class="actions">
    <button id="installBtn" class="primary hidden">Instalar Patio Conecta en este equipo</button>
    <button id="iosBtn" class="secondary hidden">Agregar Patio Conecta en iPhone / iPad</button>
    <button id="manualBtn" class="secondary hidden">Ver cómo instalar en este equipo</button>
  </div>

  <div id="status" class="status hidden"></div>

  <div class="small">Acceso exclusivo para operadores autorizados de Patio Bellavista.</div>
</section>

</div>

<script>
const APP_URL = 'https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec?authuser=0';
const q = s => document.querySelector(s);
const installChoiceBtn = q('#installChoiceBtn');
const installBtn = q('#installBtn');
const iosBtn = q('#iosBtn');
const manualBtn = q('#manualBtn');
const status = q('#status');
let deferredPrompt = null;

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid() { return /android/i.test(navigator.userAgent); }
function isWindows() { return /windows/i.test(navigator.userAgent); }
function isMac() { return /macintosh|mac os x/i.test(navigator.userAgent) && !isIOS(); }
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function installedMessage() {
  let place = 'tu menú de aplicaciones';
  if (isMac()) {
    place = '<b>Aplicaciones</b>, <b>Launchpad</b> o el <b>Dock</b> si decidiste mantenerla ahí';
  } else if (isWindows()) {
    place = '<b>Inicio</b>, <b>Aplicaciones</b> o la <b>barra de tareas</b> si la fijaste';
  } else if (isIOS()) {
    place = 'la <b>pantalla de inicio</b> o la <b>Biblioteca de apps</b>';
  } else if (isAndroid()) {
    place = 'la <b>pantalla principal</b> o el <b>cajón de aplicaciones</b>';
  }
  return `
    <div class="installed-box">
      <div class="installed-head">
        <div class="installed-check">✓</div>
        <div>
          <h3>Patio Conecta ya está instalada</h3>
          <p>La instalación terminó correctamente. Ya puedes abrirla como una aplicación.</p>
        </div>
      </div>
      <div class="launch-hint">Ahora puedes abrir <b>Patio Conecta</b> desde ${place}.</div>
      <a class="open-now" href="${APP_URL}">Abrir Patio Conecta ahora →</a>
      <div class="install-note">Puedes cerrar esta página cuando quieras.</div>
    </div>
  `;
}

function getBrowser() {
  const ua = navigator.userAgent || '';

  if (isIOS()) {
    if (/CriOS/i.test(ua)) return 'Chrome';
    if (/EdgiOS/i.test(ua)) return 'Edge';
    if (/FxiOS/i.test(ua)) return 'Firefox';
    if (/OPiOS/i.test(ua)) return 'Opera';
    if (/Instagram/i.test(ua)) return 'Navegador interno';
    if (/FBAN|FBAV/i.test(ua)) return 'Navegador interno';
    if (/WhatsApp/i.test(ua)) return 'Navegador interno';
    if (/GSA/i.test(ua)) return 'Navegador interno';
    if (/Safari/i.test(ua)) return 'Safari';
    return 'Otro navegador';
  }

  if (isAndroid()) {
    if (/Firefox/i.test(ua)) return 'Firefox';
    if (/EdgA/i.test(ua)) return 'Edge';
    if (/SamsungBrowser/i.test(ua)) return 'Samsung Internet';
    if (/Chrome/i.test(ua)) return 'Chrome';
    return 'Otro navegador';
  }

  if (/Edg/i.test(ua)) return 'Edge';
  if (/Firefox/i.test(ua)) return 'Firefox';
  if (/Chrome/i.test(ua)) return 'Chrome';
  if (/Safari/i.test(ua)) return 'Safari';

  return 'Navegador';
}

function shareIcon() {
  return `<span class="share-icon" aria-label="Compartir">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 15V3"></path>
      <path d="M8.5 6.5 12 3l3.5 3.5"></path>
      <path d="M7 9H5.8A1.8 1.8 0 0 0 4 10.8v8.4A1.8 1.8 0 0 0 5.8 21h12.4a1.8 1.8 0 0 0 1.8-1.8v-8.4A1.8 1.8 0 0 0 18.2 9H17"></path>
    </svg>
  </span>`;
}

function firefoxInstallIcon() {
  return `<span class="install-browser-icon" aria-label="Icono de instalación de Firefox"><svg viewBox="0 0 28 28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4.5h12v3.2h3v15.8H5V7.7h3z"></path><path d="M14 3v11"></path><path d="m10.5 10.5 3.5 3.5 3.5-3.5"></path><path d="M8 19.5h12"></path></svg></span>`;
}

function guideHTML(device,browser,title,steps,note='') {
  return `
    <div class="install-guide">
      <div class="install-detected">✓ Detectamos: ${device} · ${browser}</div>
      <div class="install-title">${title}</div>
      <div class="install-steps">
        ${steps.map((s,i)=>`
          <div class="install-step">
            <div class="install-step-num">${i+1}</div>
            <div>${s}</div>
          </div>
        `).join('')}
      </div>
      ${note ? `<div class="install-note">${note}</div>` : ''}
    </div>
  `;
}

function show(el) { el.classList.remove('hidden'); }

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  installBtn.classList.add('hidden');
  manualBtn.classList.add('hidden');
  iosBtn.classList.add('hidden');
  status.classList.remove('hidden');
  status.innerHTML = installedMessage();
});

function refreshInstallUI() {
  installBtn.classList.add('hidden');
  iosBtn.classList.add('hidden');
  manualBtn.classList.add('hidden');
  status.classList.remove('hidden');

  if (isStandalone()) {
    status.innerHTML = installedMessage();
    return;
  }

  if (deferredPrompt) {
    show(installBtn);
    status.innerHTML = '<strong>Instalación directa disponible.</strong><br>Pulsa “Instalar Patio Conecta en este equipo”.';
    return;
  }

  if (isIOS()) {
    show(iosBtn);
    const browser = getBrowser();
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      browser,
      'Patio Conecta puede agregarse a tu pantalla de inicio.',
      ['Pulsa el botón <b>“Agregar Patio Conecta en iPhone / iPad”</b>.'],
      'Las instrucciones se adaptarán al navegador que estás usando.'
    );
    return;
  }

  show(manualBtn);
  status.innerHTML = '<strong>El navegador no habilitó la instalación directa.</strong><br>Usa “Ver cómo instalar en este equipo”.';
}

installChoiceBtn.addEventListener('click', () => {
  refreshInstallUI();
  status.scrollIntoView({behavior:'smooth', block:'nearest'});
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) {
    refreshInstallUI();
    return;
  }
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  if (result.outcome === 'accepted') {
    status.innerHTML = '<strong>Instalación iniciada.</strong><br>Confirma la ventana del navegador.';
  } else {
    status.innerHTML = '<strong>Instalación cancelada.</strong><br>Puedes volver a intentarlo.';
  }
  deferredPrompt = null;
});

iosBtn.addEventListener('click', () => {
  const browser = getBrowser();

  if (browser === 'Safari') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Safari',
      'Instala Patio Conecta en 3 pasos',
      [
        'Toca el botón <b>Compartir</b> ' + shareIcon() + '.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Toca <b>Añadir</b> o <b>Agregar</b>.'
      ],
      'Patio Conecta quedará como un icono en tu pantalla de inicio.'
    );
    return;
  }

  if (browser === 'Chrome') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Chrome',
      'Instala Patio Conecta desde Chrome',
      [
        'Toca el icono <b>Compartir</b> ' + shareIcon() + ' de Chrome.',
        'Desliza las opciones hacia abajo y toca <b>“Añadir a pantalla de inicio”</b>.',
        'Confirma tocando <b>“Añadir”</b>.'
      ],
      'Busca el mismo símbolo de Compartir que ves en la barra de Chrome: una caja con una flecha hacia arriba.'
    );
    return;
  }

  if (browser === 'Edge') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Edge',
      'Instala Patio Conecta desde Edge',
      [
        'Abre el menú de <b>Compartir</b>.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Confirma con <b>Añadir</b> o <b>Agregar</b>.'
      ],
      'Si la opción no aparece, puedes abrir esta misma página en Safari.'
    );
    return;
  }

  if (browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Firefox',
      'Agrega Patio Conecta a tu pantalla de inicio',
      [
        'Abre el menú de <b>Compartir</b> de Firefox.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Confirma la acción.'
      ],
      'Si Firefox no ofrece esa opción en tu versión, abre esta misma página en Safari.'
    );
    return;
  }

  if (browser === 'Navegador interno') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Navegador interno',
      'Primero abre Patio Conecta en un navegador',
      [
        'Toca <b>⋯</b> o <b>Compartir</b> en la parte superior.',
        'Elige <b>“Abrir en navegador”</b>, <b>“Abrir en Safari”</b> o <b>“Abrir en Chrome”</b>.',
        'Cuando se abra el navegador, vuelve a pulsar <b>“Descargar la app”</b>.'
      ],
      'El nombre exacto de la opción puede cambiar según WhatsApp, Gmail, Instagram u otra aplicación.'
    );
    return;
  }

  status.innerHTML = guideHTML(
    'iPhone / iPad',
    browser,
    'Agrega Patio Conecta a tu pantalla de inicio',
    [
      'Abre el menú <b>Compartir</b> de tu navegador.',
      'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
      'Confirma con <b>Añadir</b> o <b>Agregar</b>.'
    ],
    'Si tu navegador no muestra esa opción, abre esta misma página en Safari.'
  );
});

manualBtn.addEventListener('click', () => {
  const browser = getBrowser();

  if (isWindows() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Windows','Firefox','Instala Patio Conecta',
      [
        'Busca este icono ' + firefoxInstallIcon() + ' en la barra superior de Firefox. Está <b>justo a la izquierda de la estrella ⭐</b>.',
        'Haz clic en ese icono de instalación.',
        'Confirma la instalación de <b>Patio Conecta</b>.'
      ],
      'Firefox creará el acceso de Patio Conecta en Windows.'
    );
    return;
  }

  if (isMac() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Mac','Firefox','Para instalar Patio Conecta',
      [
        'Firefox en Mac no muestra el botón de instalación de aplicaciones web.',
        'Abre <b>Safari</b> o <b>Chrome</b> en tu Mac.',
        'Pega <b>fortisi.cl/patio-conecta/</b>. Patio Conecta detectará el nuevo navegador y te mostrará automáticamente cómo instalarla.'
      ],
      'Puedes seguir usando Patio Conecta normalmente en Firefox. Solo necesitas Safari o Chrome si quieres dejarla instalada como aplicación.'
    ) + '<div class="browser-actions"><button type="button" class="browser-action" id="copyPatioUrl">Copiar enlace de Patio Conecta</button></div>';

    const copyBtn = document.getElementById('copyPatioUrl');
    if (copyBtn) copyBtn.addEventListener('click', async () => {
      const url='https://fortisi.cl/patio-conecta/';
      try { await navigator.clipboard.writeText(url); }
      catch(e) {
        const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
      }
      copyBtn.textContent='✓ Enlace copiado';
    });
    return;
  }

  if (isWindows()) {
    status.innerHTML = guideHTML(
      'Windows',
      browser,
      'Instala Patio Conecta',
      [
        'Abre el menú del navegador <b>⋮</b>.',
        'Selecciona <b>Instalar página como app</b> o <b>Instalar aplicación</b>.',
        'Confirma la instalación.'
      ]
    );
  } else if (isMac()) {
    status.innerHTML = guideHTML(
      'Mac',
      browser,
      'Instala Patio Conecta',
      browser === 'Safari'
        ? [
            'Haz clic en el icono <b>Compartir</b> ' + shareIcon() + ' que está en la esquina superior derecha de Safari.',
            'En el menú que se abre, selecciona <b>“Agregar al Dock”</b>.',
            'Revisa que el nombre sea <b>“Patio Conecta”</b> y confirma con <b>“Agregar”</b>.'
          ]
        : [
            'Abre el menú de Chrome o Edge.',
            'Selecciona <b>Instalar página como app</b>.',
            'Confirma.'
          ],
      browser === 'Safari'
        ? 'Listo: Patio Conecta quedará disponible como una aplicación en tu Mac y podrás abrirla desde el Dock o desde Aplicaciones.'
        : ''
    );
  } else if (isAndroid() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Android',
      'Firefox',
      'Agrega Patio Conecta desde Firefox',
      [
        'Toca el menú <b>⋮</b> de Firefox.',
        'Selecciona <b>Instalar</b> o <b>Añadir / Agregar a pantalla de inicio</b>.',
        'Confirma para crear el acceso de Patio Conecta.'
      ],
      'El icono se obtiene del manifest de Patio Conecta. Si ya tenías un acceso antiguo, elimínalo y vuelve a agregarlo para que Firefox tome el icono actualizado.'
    );
  } else if (isAndroid()) {
    status.innerHTML = guideHTML(
      'Android',
      browser,
      'Instala Patio Conecta',
      [
        'Abre el menú <b>⋮</b> del navegador.',
        'Selecciona <b>Instalar app</b> o <b>Añadir / Agregar a pantalla principal</b>.',
        'Confirma la instalación.'
      ]
    );
  } else {
    status.innerHTML = '<strong>Instalación manual</strong><br>Utiliza la opción de instalar o agregar aplicación disponible en tu navegador.';
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
    } catch (err) {
      // Conservamos la página usable aunque falle el service worker.
    }
  });
}
</script>
</body>
</html>
