<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b168d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Patio Conecta">
  <title>Patio Conecta</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f6f3f8;color:#291632}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
    .card{width:min(720px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 18px 55px rgba(60,25,75,.14)}
    .brand{display:flex;align-items:center;gap:18px;margin-bottom:22px}
    .brand img{width:86px;height:86px;border-radius:20px}
    h1{margin:0;color:#5b168d;font-size:31px}
    .sub{margin:5px 0 0;color:#756b7a}
    .lead{color:#5f5664;line-height:1.55}
    label{display:block;font-size:14px;font-weight:700;margin:13px 0 6px}
    input{width:100%;padding:14px;border:1px solid #d8cddd;border-radius:12px;font-size:16px}
    button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
    .primary{background:#5b168d;color:white}
    .open{background:#ef3340;color:white;margin-bottom:12px}
    .secondary{background:#f2eaf6;color:#5b168d;border:1px solid #e2d3e9}
    .disabled{background:#eee;color:#888;cursor:not-allowed}
    .hidden{display:none!important}
    .error{display:none;color:#b42318;margin-top:10px}
    .error.show{display:block}
    .status{margin-top:16px;padding:15px;border-radius:14px;background:#faf8fb;line-height:1.55}
    .status strong{color:#5b168d}
    .actions{display:grid;gap:12px;margin-top:20px}
    .back{margin-top:14px;background:white;color:#5b168d;border:1px solid #d9cce0}
    .small{font-size:13px;color:#817787;margin-top:14px}

    /* SOLO NUEVO: presentación visual de instrucciones de instalación */
    .install-guide{display:grid;gap:12px}
    .install-detected{display:inline-flex;align-items:center;gap:7px;width:max-content;max-width:100%;padding:6px 10px;border-radius:999px;background:#efe6f4;color:#5b168d;font-size:12px;font-weight:700}
    .install-title{font-size:17px;font-weight:800;color:#291632}
    .install-copy{font-size:14px;color:#655a6a}
    .install-steps{display:grid;gap:9px}
    .install-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 11px;border-radius:12px;background:#fff;border:1px solid #e9dfee}
    .install-step-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#5b168d;color:#fff;font-size:13px;font-weight:800}
    .install-step div:last-child{padding-top:4px;font-size:14px;color:#4f4554}
    .install-note{font-size:12px;color:#7d7282}
    .share-icon{display:inline-flex;vertical-align:-4px;margin:0 3px}
    .share-icon svg{width:21px;height:21px;display:block;stroke:currentColor}

    @media(max-width:560px){
      .card{padding:22px 18px}
      .brand img{width:70px;height:70px}
      h1{font-size:27px}
    }
  </style>
</head>
<body>
<div class="wrap">

<section id="loginCard" class="card">
  <div class="brand">
    <img src="./icons/icon-192.png" alt="Patio Conecta">
    <div><h1>Ingreso Operadores</h1><p class="sub">Patio Conecta</p></div>
  </div>
  <p class="lead">Ingresa el nombre del local y la clave.</p>
  <form id="loginForm">
    <label for="local">Local</label>
    <input id="local" required placeholder="Nombre del local">
    <label for="clave">Clave</label>
    <input id="clave" type="password" required placeholder="Clave">
    <button class="primary" type="submit" style="margin-top:18px">Ingresar</button>
    <div id="loginError" class="error">Local o clave incorrectos.</div>
  </form>
</section>

<section id="portalCard" class="card hidden">
  <div class="brand">
    <img src="./icons/icon-192.png" alt="Patio Conecta">
    <div><h1>Patio Conecta</h1><p class="sub">Acceso Operadores · Santiago</p></div>
  </div>

  <div class="actions">
    <a class="btn open" href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec">Abrir Patio Conecta</a>

    <button id="installBtn" class="primary hidden">Instalar Patio Conecta en este equipo</button>

    <button id="iosBtn" class="secondary hidden">Agregar Patio Conecta en iPhone / iPad</button>

    <button id="manualBtn" class="secondary hidden">Ver cómo instalar en este equipo</button>
  </div>

  <div id="status" class="status">
    <strong>Comprobando instalación…</strong><br>
    Esta página mostrará el botón de instalación directa solo si el navegador realmente lo habilita.
  </div>

  <button id="logoutBtn" class="back">Volver al ingreso</button>
</section>

</div>

<script>
const q = s => document.querySelector(s);
const loginCard = q('#loginCard');
const portalCard = q('#portalCard');
const loginError = q('#loginError');
const installBtn = q('#installBtn');
const iosBtn = q('#iosBtn');
const manualBtn = q('#manualBtn');
const status = q('#status');
let deferredPrompt = null;

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid() { return /android/i.test(navigator.userAgent); }
function isWindows() { return /windows/i.test(navigator.userAgent); }
function isMac() { return /macintosh|mac os x/i.test(navigator.userAgent) && !isIOS(); }
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function getBrowser() {
  const ua = navigator.userAgent || '';

  if (isIOS()) {
    if (/CriOS/i.test(ua)) return 'Chrome';
    if (/EdgiOS/i.test(ua)) return 'Edge';
    if (/FxiOS/i.test(ua)) return 'Firefox';
    if (/OPiOS/i.test(ua)) return 'Opera';
    if (/Instagram/i.test(ua)) return 'Navegador interno';
    if (/FBAN|FBAV/i.test(ua)) return 'Navegador interno';
    if (/WhatsApp/i.test(ua)) return 'Navegador interno';
    if (/GSA/i.test(ua)) return 'Navegador interno';
    if (/Safari/i.test(ua)) return 'Safari';
    return 'Otro navegador';
  }

  if (isAndroid()) {
    if (/Firefox/i.test(ua)) return 'Firefox';
    if (/EdgA/i.test(ua)) return 'Edge';
    if (/SamsungBrowser/i.test(ua)) return 'Samsung Internet';
    if (/Chrome/i.test(ua)) return 'Chrome';
    return 'Otro navegador';
  }

  if (/Edg/i.test(ua)) return 'Edge';
  if (/Firefox/i.test(ua)) return 'Firefox';
  if (/Chrome/i.test(ua)) return 'Chrome';
  if (/Safari/i.test(ua)) return 'Safari';

  return 'Navegador';
}

function shareIcon() {
  return `<span class="share-icon" aria-label="Compartir">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 15V3"></path>
      <path d="M8.5 6.5 12 3l3.5 3.5"></path>
      <path d="M7 9H5.8A1.8 1.8 0 0 0 4 10.8v8.4A1.8 1.8 0 0 0 5.8 21h12.4a1.8 1.8 0 0 0 1.8-1.8v-8.4A1.8 1.8 0 0 0 18.2 9H17"></path>
    </svg>
  </span>`;
}

function guideHTML(device,browser,title,steps,note='') {
  return `
    <div class="install-guide">
      <div class="install-detected">✓ Detectamos: ${device} · ${browser}</div>
      <div class="install-title">${title}</div>
      <div class="install-steps">
        ${steps.map((s,i)=>`
          <div class="install-step">
            <div class="install-step-num">${i+1}</div>
            <div>${s}</div>
          </div>
        `).join('')}
      </div>
      ${note ? `<div class="install-note">${note}</div>` : ''}
    </div>
  `;
}

function show(el) { el.classList.remove('hidden'); }

q('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const local = q('#local').value.trim().toLowerCase();
  const clave = q('#clave').value.trim().toLowerCase();
  if (local === 'santiago' && clave === 'santiago') {
    loginError.classList.remove('show');
    loginCard.classList.add('hidden');
    portalCard.classList.remove('hidden');
    refreshInstallUI();
  } else {
    loginError.classList.add('show');
  }
});

q('#logoutBtn').onclick = () => {
  portalCard.classList.add('hidden');
  loginCard.classList.remove('hidden');
};

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallUI();
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  installBtn.classList.add('hidden');
  manualBtn.classList.add('hidden');
  status.innerHTML = '<strong>Instalación completada.</strong><br>Patio Conecta ya quedó instalada en este equipo.';
});

function refreshInstallUI() {
  installBtn.classList.add('hidden');
  iosBtn.classList.add('hidden');
  manualBtn.classList.add('hidden');

  if (isStandalone()) {
    status.innerHTML = '<strong>Patio Conecta ya está instalada.</strong><br>Estás utilizando la aplicación en modo independiente.';
    return;
  }

  if (deferredPrompt) {
    show(installBtn);
    status.innerHTML = '<strong>Instalación directa disponible.</strong><br>Pulsa “Instalar Patio Conecta en este equipo”.';
    return;
  }

  if (isIOS()) {
    show(iosBtn);
    const browser = getBrowser();
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      browser,
      'Patio Conecta puede agregarse a tu pantalla de inicio.',
      ['Pulsa el botón <b>“Agregar Patio Conecta en iPhone / iPad”</b>.'],
      'Las instrucciones se adaptarán al navegador que estás usando.'
    );
    return;
  }

  show(manualBtn);
  status.innerHTML = '<strong>El navegador no habilitó la instalación directa.</strong><br>Usa “Ver cómo instalar en este equipo”.';
}

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) {
    refreshInstallUI();
    return;
  }
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  if (result.outcome === 'accepted') {
    status.innerHTML = '<strong>Instalación iniciada.</strong><br>Confirma la ventana del navegador.';
  } else {
    status.innerHTML = '<strong>Instalación cancelada.</strong><br>Puedes volver a intentarlo.';
  }
  deferredPrompt = null;
});

iosBtn.addEventListener('click', () => {
  const browser = getBrowser();

  if (browser === 'Safari') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Safari',
      'Instala Patio Conecta en 3 pasos',
      [
        'Toca el botón <b>Compartir</b> ' + shareIcon() + '.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Toca <b>Añadir</b> o <b>Agregar</b>.'
      ],
      'Patio Conecta quedará como un icono en tu pantalla de inicio.'
    );
    return;
  }

  if (browser === 'Chrome') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Chrome',
      'Instala Patio Conecta desde Chrome',
      [
        'Toca el icono <b>Compartir</b> ' + shareIcon() + ' de Chrome.',
        'Desliza las opciones hacia abajo y toca <b>“Añadir a pantalla de inicio”</b>.',
        'Confirma tocando <b>“Añadir”</b>.'
      ],
      'Busca el mismo símbolo de Compartir que ves en la barra de Chrome: una caja con una flecha hacia arriba.'
    );
    return;
  }

  if (browser === 'Edge') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Edge',
      'Instala Patio Conecta desde Edge',
      [
        'Abre el menú de <b>Compartir</b>.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Confirma con <b>Añadir</b> o <b>Agregar</b>.'
      ],
      'Si la opción no aparece, puedes abrir esta misma página en Safari.'
    );
    return;
  }

  if (browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Firefox',
      'Agrega Patio Conecta a tu pantalla de inicio',
      [
        'Abre el menú de <b>Compartir</b> de Firefox.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Confirma la acción.'
      ],
      'Si Firefox no ofrece esa opción en tu versión, abre esta misma página en Safari.'
    );
    return;
  }

  if (browser === 'Navegador interno') {
    status.innerHTML = guideHTML(
      'iPhone / iPad',
      'Navegador interno',
      'Primero abre Patio Conecta en un navegador',
      [
        'Toca <b>⋯</b> o <b>Compartir</b> en la parte superior.',
        'Elige <b>“Abrir en navegador”</b>, <b>“Abrir en Safari”</b> o <b>“Abrir en Chrome”</b>.',
        'Cuando se abra el navegador, vuelve a pulsar <b>“Agregar Patio Conecta en iPhone / iPad”</b>.'
      ],
      'El nombre exacto de la opción puede cambiar según WhatsApp, Gmail, Instagram u otra aplicación.'
    );
    return;
  }

  status.innerHTML = guideHTML(
    'iPhone / iPad',
    browser,
    'Agrega Patio Conecta a tu pantalla de inicio',
    [
      'Abre el menú <b>Compartir</b> de tu navegador.',
      'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
      'Confirma con <b>Añadir</b> o <b>Agregar</b>.'
    ],
    'Si tu navegador no muestra esa opción, abre esta misma página en Safari.'
  );
});

manualBtn.addEventListener('click', () => {
  const browser = getBrowser();

  if (isWindows()) {
    status.innerHTML = guideHTML(
      'Windows',
      browser,
      'Instala Patio Conecta',
      [
        'Abre el menú del navegador <b>⋮</b>.',
        'Selecciona <b>Instalar página como app</b> o <b>Instalar aplicación</b>.',
        'Confirma la instalación.'
      ]
    );
  } else if (isMac()) {
    status.innerHTML = guideHTML(
      'Mac',
      browser,
      'Instala Patio Conecta',
      browser === 'Safari'
        ? [
            'En Safari abre el menú <b>Archivo</b>.',
            'Selecciona <b>Agregar al Dock</b>.',
            'Confirma.'
          ]
        : [
            'Abre el menú de Chrome o Edge.',
            'Selecciona <b>Instalar página como app</b>.',
            'Confirma.'
          ]
    );
  } else if (isAndroid() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Android',
      'Firefox',
      'Agrega Patio Conecta desde Firefox',
      [
        'Toca el menú <b>⋮</b> de Firefox.',
        'Selecciona <b>Instalar</b> o <b>Añadir / Agregar a pantalla de inicio</b>.',
        'Confirma para crear el acceso de Patio Conecta.'
      ],
      'El icono se obtiene del manifest de Patio Conecta. Si ya tenías un acceso antiguo, elimínalo y vuelve a agregarlo para que Firefox tome el icono actualizado.'
    );
  } else if (isAndroid()) {
    status.innerHTML = guideHTML(
      'Android',
      browser,
      'Instala Patio Conecta',
      [
        'Abre el menú <b>⋮</b> del navegador.',
        'Selecciona <b>Instalar app</b> o <b>Añadir / Agregar a pantalla principal</b>.',
        'Confirma la instalación.'
      ]
    );
  } else {
    status.innerHTML = '<strong>Instalación manual</strong><br>Utiliza la opción de instalar o agregar aplicación disponible en tu navegador.';
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
    } catch (err) {
      status.innerHTML = '<strong>Error de instalación.</strong><br>No se pudo registrar el service worker.';
    }
    setTimeout(refreshInstallUI, 700);
  });
} else {
  setTimeout(refreshInstallUI, 300);
}
</script>
</body>
</html>
