<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b168d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Patio Conecta">
  <title>Acceso Operadores | Patio Conecta</title>

  <!-- CONSERVA LOS MISMOS RECURSOS PWA QUE YA PROBAMOS -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f6f3f8;color:#291632}
    body{overflow:hidden}

    .shell{height:100%;display:grid;grid-template-rows:auto 1fr}

    .topbar{
      position:relative;z-index:20;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:10px 16px;
      background:#fff;border-bottom:1px solid #e8dfea;
      box-shadow:0 3px 14px rgba(60,25,75,.07)
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand img{width:42px;height:42px;border-radius:11px;flex:0 0 auto}
    .brand-copy{min-width:0}
    .brand-copy strong{display:block;color:#5b168d;font-size:15px;line-height:1.1}
    .brand-copy small{display:block;color:#786e7d;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    button,a.action{
      border:0;border-radius:11px;padding:10px 13px;
      font:inherit;font-size:12px;font-weight:800;cursor:pointer;
      text-decoration:none;text-align:center
    }
    .primary{background:#5b168d;color:#fff}
    .secondary{background:#f3ebf6;color:#5b168d;border:1px solid #e2d4e8}
    .open-external{background:#ef3340;color:#fff}

    .app-wrap{position:relative;min-height:0;background:#f8f6f9}
    #patioApp{width:100%;height:100%;border:0;display:block;background:#fff}

    .loading{
      position:absolute;inset:0;z-index:5;display:grid;place-items:center;
      background:#f6f3f8;transition:opacity .2s ease
    }
    .loading.hidden{opacity:0;pointer-events:none}
    .loading-card{
      width:min(360px,calc(100% - 32px));background:#fff;border-radius:22px;
      padding:24px;text-align:center;box-shadow:0 16px 45px rgba(60,25,75,.12)
    }
    .loading-card img{width:68px;height:68px;border-radius:16px}
    .loading-card h2{color:#5b168d;font-size:20px;margin:12px 0 5px}
    .loading-card p{font-size:13px;line-height:1.5;color:#756b7a;margin:0}

    .drawer-backdrop{
      position:fixed;inset:0;background:rgba(31,16,39,.40);z-index:90;
      opacity:0;pointer-events:none;transition:.2s
    }
    .drawer-backdrop.show{opacity:1;pointer-events:auto}

    .drawer{
      position:fixed;right:0;top:0;height:100%;width:min(430px,100%);
      z-index:100;background:#fff;padding:20px;overflow:auto;
      transform:translateX(102%);transition:.25s ease;
      box-shadow:-18px 0 50px rgba(31,16,39,.20)
    }
    .drawer.show{transform:translateX(0)}
    .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
    .drawer-head h2{margin:0;color:#5b168d;font-size:22px}
    .drawer-head p{margin:5px 0 0;color:#756b7a;font-size:12px}
    .close{width:36px;height:36px;border-radius:50%;padding:0;background:#f2ebf5;color:#5b168d;font-size:18px}

    .status{margin-top:12px;padding:14px;border-radius:15px;background:#faf8fb;line-height:1.55}
    .status strong{color:#5b168d}

    .install-guide{display:grid;gap:12px}
    .install-detected{
      display:inline-flex;align-items:center;gap:7px;width:max-content;max-width:100%;
      padding:6px 10px;border-radius:999px;background:#efe6f4;color:#5b168d;
      font-size:12px;font-weight:700
    }
    .install-title{font-size:17px;font-weight:800;color:#291632}
    .install-steps{display:grid;gap:9px}
    .install-step{
      display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;
      padding:10px 11px;border-radius:12px;background:#fff;border:1px solid #e9dfee
    }
    .install-step-num{
      width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
      background:#5b168d;color:#fff;font-size:13px;font-weight:800
    }
    .install-step div:last-child{padding-top:4px;font-size:14px;color:#4f4554}
    .install-note{font-size:12px;color:#7d7282}
    .share-icon{display:inline-flex;vertical-align:-4px;margin:0 3px}
    .share-icon svg{width:21px;height:21px;display:block;stroke:currentColor}
    .install-browser-icon{
      display:inline-flex;vertical-align:-6px;margin:0 5px;padding:3px;
      border:1px solid #ded3e4;border-radius:7px;background:#fff;color:#291632
    }
    .install-browser-icon svg{width:25px;height:25px;display:block;stroke:currentColor}

    .drawer-actions{display:grid;gap:9px;margin-top:14px}
    .drawer-actions button{width:100%}

    @media(max-width:700px){
      .topbar{padding:8px 10px}
      .brand-copy small{display:none}
      .brand img{width:38px;height:38px}
      .top-actions{gap:6px}
      button,a.action{font-size:11px;padding:9px 10px}
      .hide-mobile{display:none}
    }
  </style>
</head>

<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <img src="./icons/icon-192.png" alt="Patio Conecta">
      <div class="brand-copy">
        <strong>Patio Conecta</strong>
        <small>Acceso Operadores · demostración de integración</small>
      </div>
    </div>

    <div class="top-actions">
      <button id="webBtn" class="secondary hide-mobile" type="button">Continuar en la web</button>
      <button id="installOpenBtn" class="primary" type="button">Instalar Patio Conecta</button>
      <a class="action open-external hide-mobile" target="_blank" rel="noopener" href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec?authuser=0">Abrir aparte</a>
    </div>
  </header>

  <main class="app-wrap">
    <!--
      CLAVE DEL PROTOTIPO:
      La interfaz que se ve aquí ES LA APP.
      No existe un login separado en la página web.
      El usuario se autentica una sola vez dentro de Patio Conecta.
    -->
    <iframe
      id="patioApp"
      title="Patio Conecta · Acceso Operadores"
      src="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec?authuser=0"
      allow="clipboard-read; clipboard-write"
    ></iframe>

    <div id="loading" class="loading">
      <div class="loading-card">
        <img src="./icons/icon-192.png" alt="Patio Conecta">
        <h2>Patio Conecta</h2>
        <p>Cargando el acceso de operadores…</p>
      </div>
    </div>
  </main>
</div>

<div id="drawerBackdrop" class="drawer-backdrop"></div>

<aside id="installDrawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <h2>Instalar Patio Conecta</h2>
      <p>Te mostramos los pasos correctos según este equipo y navegador.</p>
    </div>
    <button id="closeDrawer" class="close" type="button" aria-label="Cerrar">×</button>
  </div>

  <div id="status" class="status">
    <strong>Comprobando instalación…</strong><br>
    Detectando este equipo.
  </div>

  <div class="drawer-actions">
    <button id="installBtn" class="primary" type="button" hidden>Instalar Patio Conecta en este equipo</button>
  </div>
</aside>

<script>
const q = s => document.querySelector(s);
const APP_URL = 'https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec?authuser=0';

const iframe = q('#patioApp');
const loading = q('#loading');
const drawer = q('#installDrawer');
const backdrop = q('#drawerBackdrop');
const status = q('#status');
const installBtn = q('#installBtn');

let deferredPrompt = null;

iframe.addEventListener('load', () => {
  setTimeout(() => loading.classList.add('hidden'), 250);
});

q('#webBtn').addEventListener('click', () => {
  closeInstall();
  iframe.focus();
});

q('#installOpenBtn').addEventListener('click', () => {
  openInstall();
  refreshInstallUI();
});

q('#closeDrawer').addEventListener('click', closeInstall);
backdrop.addEventListener('click', closeInstall);

function openInstall() {
  drawer.classList.add('show');
  backdrop.classList.add('show');
  drawer.setAttribute('aria-hidden','false');
}
function closeInstall() {
  drawer.classList.remove('show');
  backdrop.classList.remove('show');
  drawer.setAttribute('aria-hidden','true');
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid() { return /android/i.test(navigator.userAgent); }
function isWindows() { return /windows/i.test(navigator.userAgent); }
function isMac() { return /macintosh|mac os x/i.test(navigator.userAgent) && !isIOS(); }
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function getBrowser() {
  const ua = navigator.userAgent || '';

  if (isIOS()) {
    if (/CriOS/i.test(ua)) return 'Chrome';
    if (/EdgiOS/i.test(ua)) return 'Edge';
    if (/FxiOS/i.test(ua)) return 'Firefox';
    if (/OPiOS/i.test(ua)) return 'Opera';
    if (/Instagram|FBAN|FBAV|WhatsApp|GSA/i.test(ua)) return 'Navegador interno';
    if (/Safari/i.test(ua)) return 'Safari';
    return 'Otro navegador';
  }

  if (isAndroid()) {
    if (/Firefox/i.test(ua)) return 'Firefox';
    if (/EdgA/i.test(ua)) return 'Edge';
    if (/SamsungBrowser/i.test(ua)) return 'Samsung Internet';
    if (/Chrome/i.test(ua)) return 'Chrome';
    return 'Otro navegador';
  }

  if (/Edg/i.test(ua)) return 'Edge';
  if (/Firefox/i.test(ua)) return 'Firefox';
  if (/Chrome/i.test(ua)) return 'Chrome';
  if (/Safari/i.test(ua)) return 'Safari';
  return 'Navegador';
}

function deviceName() {
  if (isIOS()) return 'iPhone / iPad';
  if (isAndroid()) return 'Android';
  if (isWindows()) return 'Windows';
  if (isMac()) return 'Mac';
  return 'Este equipo';
}

function shareIcon() {
  return `<span class="share-icon" aria-label="Compartir">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 15V3"></path>
      <path d="M8.5 6.5 12 3l3.5 3.5"></path>
      <path d="M7 9H5.8A1.8 1.8 0 0 0 4 10.8v8.4A1.8 1.8 0 0 0 5.8 21h12.4a1.8 1.8 0 0 0 1.8-1.8v-8.4A1.8 1.8 0 0 0 18.2 9H17"></path>
    </svg>
  </span>`;
}

function firefoxInstallIcon() {
  return `<span class="install-browser-icon" aria-label="Icono de instalación de Firefox">
    <svg viewBox="0 0 28 28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 4.5h12v3.2h3v15.8H5V7.7h3z"></path>
      <path d="M14 3v11"></path>
      <path d="m10.5 10.5 3.5 3.5 3.5-3.5"></path>
      <path d="M8 19.5h12"></path>
    </svg>
  </span>`;
}

function guideHTML(device,browser,title,steps,note='') {
  return `
    <div class="install-guide">
      <div class="install-detected">✓ Detectamos: ${device} · ${browser}</div>
      <div class="install-title">${title}</div>
      <div class="install-steps">
        ${steps.map((s,i)=>`
          <div class="install-step">
            <div class="install-step-num">${i+1}</div>
            <div>${s}</div>
          </div>
        `).join('')}
      </div>
      ${note ? `<div class="install-note">${note}</div>` : ''}
    </div>
  `;
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallUI();
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  installBtn.hidden = true;
  status.innerHTML = '<strong>Instalación completada.</strong><br>Patio Conecta ya quedó instalada en este equipo.';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) {
    refreshInstallUI();
    return;
  }
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  deferredPrompt = null;
  status.innerHTML = result.outcome === 'accepted'
    ? '<strong>Instalación iniciada.</strong><br>Confirma la ventana del navegador.'
    : '<strong>Instalación cancelada.</strong><br>Puedes volver a intentarlo.';
});

function refreshInstallUI() {
  installBtn.hidden = true;

  const browser = getBrowser();
  const device = deviceName();

  if (isStandalone()) {
    status.innerHTML = '<strong>Patio Conecta ya está instalada.</strong><br>Estás utilizando la aplicación en modo independiente.';
    return;
  }

  if (deferredPrompt) {
    installBtn.hidden = false;
    status.innerHTML = guideHTML(
      device,browser,'Instalación directa disponible',
      ['Pulsa <b>“Instalar Patio Conecta en este equipo”</b>.','Confirma la instalación cuando el navegador lo solicite.']
    );
    return;
  }

  if (isIOS()) {
    if (browser === 'Navegador interno') {
      status.innerHTML = guideHTML(
        device,browser,'Primero abre Patio Conecta en un navegador',
        [
          'Toca <b>⋯</b> o <b>Compartir</b> ' + shareIcon() + '.',
          'Elige <b>“Abrir en navegador”</b>, <b>“Abrir en Safari”</b> o <b>“Abrir en Chrome”</b>.',
          'Ya en el navegador, vuelve a abrir <b>Instalar Patio Conecta</b>.'
        ],
        'El nombre exacto de la opción puede variar según la aplicación desde donde abriste el enlace.'
      );
      return;
    }

    status.innerHTML = guideHTML(
      device,browser,'Agrega Patio Conecta a tu pantalla de inicio',
      [
        'Toca <b>Compartir</b> ' + shareIcon() + ' en tu navegador.',
        'Busca <b>“Añadir a pantalla de inicio”</b> o <b>“Agregar a pantalla de inicio”</b>.',
        'Confirma con <b>“Añadir”</b> o <b>“Agregar”</b>.'
      ],
      'Patio Conecta quedará como un icono en tu pantalla de inicio.'
    );
    return;
  }

  if (isWindows() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Windows','Firefox','Instala Patio Conecta',
      [
        'Busca este icono ' + firefoxInstallIcon() + ' en la barra superior de Firefox. Está <b>justo a la izquierda de la estrella ⭐</b>.',
        'Haz clic en ese icono de instalación.',
        'Confirma la instalación de <b>Patio Conecta</b>.'
      ]
    );
    return;
  }

  if (isMac() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Mac','Firefox','Para instalar Patio Conecta',
      [
        'Firefox en Mac no muestra el botón de instalación de aplicaciones web.',
        'Abre <b>Safari</b> o <b>Chrome</b>.',
        'Pega <b>fortisi.cl/patio-conecta/</b> y vuelve a elegir <b>Instalar Patio Conecta</b>.'
      ],
      'Puedes seguir usando la app normalmente aquí en Firefox.'
    );
    return;
  }

  if (isMac() && browser === 'Safari') {
    status.innerHTML = guideHTML(
      'Mac','Safari','Instala Patio Conecta',
      [
        'Haz clic en <b>Compartir</b> ' + shareIcon() + ' arriba a la derecha.',
        'Selecciona <b>“Agregar al Dock”</b>.',
        'Revisa el nombre <b>“Patio Conecta”</b> y confirma con <b>“Agregar”</b>.'
      ]
    );
    return;
  }

  if (isAndroid() && browser === 'Firefox') {
    status.innerHTML = guideHTML(
      'Android','Firefox','Agrega Patio Conecta',
      [
        'Toca el menú <b>⋮</b> de Firefox.',
        'Selecciona <b>Instalar</b> o <b>Añadir / Agregar a pantalla de inicio</b>.',
        'Confirma.'
      ],
      'El icono instalado se obtiene del manifest de Patio Conecta.'
    );
    return;
  }

  status.innerHTML = guideHTML(
    device,browser,'Instala Patio Conecta',
    [
      'Abre el menú del navegador.',
      'Busca <b>Instalar app</b>, <b>Instalar página como app</b> o <b>Añadir / Agregar a pantalla principal</b>.',
      'Confirma la instalación.'
    ]
  );
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
    } catch (e) {
      console.warn('Service worker:', e);
    }
  });
}
</script>
</body>
</html>
