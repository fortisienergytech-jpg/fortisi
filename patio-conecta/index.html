<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b168d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Patio Conecta">
  <title>Patio Conecta</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png">

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background:#f6f3f8; color:#24152c; }
    body { min-height:100vh; }
    .wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(680px,100%); background:#fff; border-radius:28px; padding:32px; box-shadow:0 18px 60px rgba(56,24,72,.14); }
    .brand { display:flex; align-items:center; gap:18px; margin-bottom:20px; }
    .brand img { width:92px; height:92px; border-radius:22px; box-shadow:0 6px 20px rgba(0,0,0,.08); }
    h1 { margin:0; font-size:32px; color:#5b168d; }
    .subtitle { margin:5px 0 0; color:#6f6675; }
    .lead { font-size:17px; line-height:1.55; color:#504758; }
    .actions { display:grid; gap:12px; margin-top:24px; }
    button, a.btn { border:0; cursor:pointer; width:100%; border-radius:15px; padding:16px 18px; font-size:16px; font-weight:700; text-decoration:none; text-align:center; }
    .primary { background:#5b168d; color:white; }
    .secondary { background:#f2eaf6; color:#5b168d; }
    .open { background:#ef3340; color:white; }
    .status { margin-top:16px; padding:14px 16px; border-radius:14px; background:#faf8fb; line-height:1.45; display:none; }
    .status.show { display:block; }
    .device { margin-top:22px; font-size:13px; color:#857b8a; text-align:center; }
    .steps { margin:10px 0 0; padding-left:22px; }
    .steps li { margin:8px 0; }
    .tiny { margin-top:18px; font-size:12px; color:#8a818f; text-align:center; }
  </style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="brand">
      <img src="./icons/icon-192.png" alt="Patio Conecta">
      <div>
        <h1>Patio Conecta</h1>
        <p class="subtitle">App para operadores</p>
      </div>
    </div>

    <p class="lead">
      Puedes abrir Patio Conecta directamente o instalar un acceso con su nombre e ícono
      en este dispositivo.
    </p>

    <div class="actions">
      <button id="installBtn" class="primary">Instalar Patio Conecta</button>
      <a class="btn open" href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec" target="_self">Abrir Patio Conecta</a>
      <button id="helpBtn" class="secondary">¿Cómo se instala en este equipo?</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="device" class="device"></div>

    <p class="tiny">
      Página de prueba temporal alojada en fortisi.cl. La aplicación operativa continúa alojada en Google Apps Script.
    </p>
  </main>
</div>

<script>
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');
const helpBtn = document.getElementById('helpBtn');
const statusBox = document.getElementById('status');
const deviceBox = document.getElementById('device');

function showStatus(html) {
  statusBox.innerHTML = html;
  statusBox.classList.add('show');
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid() { return /android/i.test(navigator.userAgent); }
function isWindows() { return /windows/i.test(navigator.userAgent); }
function isMac() { return /macintosh|mac os x/i.test(navigator.userAgent) && !isIOS(); }
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

function deviceName() {
  if (isIOS()) return 'iPhone / iPad';
  if (isAndroid()) return 'Android';
  if (isWindows()) return 'Windows';
  if (isMac()) return 'Mac';
  return 'este dispositivo';
}

deviceBox.textContent = 'Dispositivo detectado: ' + deviceName();

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.textContent = 'Instalar Patio Conecta';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  showStatus('<strong>Listo.</strong> Patio Conecta quedó instalada con su nombre e ícono.');
  installBtn.textContent = 'Patio Conecta instalada';
  installBtn.disabled = true;
});

installBtn.addEventListener('click', async () => {
  if (isStandalone()) {
    showStatus('<strong>Patio Conecta ya está abierta como aplicación instalada.</strong>');
    return;
  }

  if (deferredPrompt) {
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice.outcome === 'accepted') {
      showStatus('Se inició la instalación. Sigue la confirmación del navegador si aparece.');
    } else {
      showStatus('La instalación fue cancelada. Puedes volver a intentarlo cuando quieras.');
    }
    deferredPrompt = null;
    return;
  }

  if (isIOS()) {
    showStatus(`
      <strong>En iPhone o iPad:</strong>
      <ol class="steps">
        <li>Toca el botón <strong>Compartir</strong> de Safari.</li>
        <li>Elige <strong>Agregar a pantalla de inicio</strong>.</li>
        <li>Confirma <strong>Agregar</strong>.</li>
      </ol>
      Apple exige estos últimos pasos manuales.
    `);
    return;
  }

  if (isMac()) {
    showStatus(`
      <strong>En Mac:</strong>
      <ol class="steps">
        <li>Si usas Chrome o Edge y aparece la opción de instalación, selecciónala.</li>
        <li>En Safari compatible también puedes usar <strong>Archivo → Agregar al Dock</strong>.</li>
      </ol>
      Si tu navegador no ofrece instalación automática, usa el botón de ayuda o abre esta página en Chrome/Edge.
    `);
    return;
  }

  if (isWindows()) {
    showStatus(`
      <strong>En Windows:</strong>
      <ol class="steps">
        <li>Abre esta página en Chrome o Edge.</li>
        <li>Si el navegador habilita la instalación, vuelve a pulsar <strong>Instalar Patio Conecta</strong>.</li>
      </ol>
    `);
    return;
  }

  if (isAndroid()) {
    showStatus(`
      <strong>En Android:</strong>
      <ol class="steps">
        <li>Abre esta página en Chrome.</li>
        <li>Vuelve a pulsar <strong>Instalar Patio Conecta</strong> cuando Chrome habilite la instalación.</li>
      </ol>
    `);
    return;
  }

  showStatus('Este navegador no ofreció instalación automática. Usa el menú del navegador para agregar esta página como aplicación o acceso directo.');
});

helpBtn.addEventListener('click', () => {
  if (isIOS()) {
    showStatus('<strong>iPhone/iPad:</strong> Safari → Compartir → Agregar a pantalla de inicio → Agregar.');
  } else if (isAndroid()) {
    showStatus('<strong>Android:</strong> Chrome → Instalar aplicación / Agregar a pantalla principal. Si el navegador habilita la instalación automática, el botón morado la abrirá directamente.');
  } else if (isWindows()) {
    showStatus('<strong>Windows:</strong> Chrome o Edge → Instalar aplicación. Cuando el navegador habilita el evento de instalación, el botón morado abre directamente esa confirmación.');
  } else if (isMac()) {
    showStatus('<strong>Mac:</strong> Chrome/Edge → Instalar aplicación; o Safari compatible → Archivo → Agregar al Dock.');
  } else {
    showStatus('Usa la opción de instalar/agregar aplicación disponible en tu navegador.');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
