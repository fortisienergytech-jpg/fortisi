<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FÓRTISI Test">
  <title>FÓRTISI · Prueba App</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" sizes="32x32" href="./icons/icon-32.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:560px;width:100%;background:white;border-radius:24px;padding:32px;
           box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center}
    img{width:112px;height:112px;border-radius:24px}
    h1{margin:18px 0 8px;font-size:28px}
    p{line-height:1.5;color:#555}
    a{display:block;margin-top:22px;padding:16px 20px;border-radius:14px;background:#111;color:#fff;
       text-decoration:none;font-weight:700}
    small{display:block;margin-top:18px;color:#777}
  </style>
</head>
<body>
<main>
  <section class="card">
    <img src="./icons/icon-192.png" alt="FÓRTISI">
    <h1>Prueba de instalación</h1>
    <p>Esta página es temporal. Su único objetivo es comprobar que una app instalada desde un dominio propio conserva nombre e ícono y puede abrir la Web App de Google Apps Script.</p>
    <a href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec" target="_self">Abrir App de Adquisiciones</a>
    <small>Después de la prueba se elimina la carpeta app-prueba.</small>
  </section>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
