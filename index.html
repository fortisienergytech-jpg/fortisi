<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b168d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patio Conecta"><title>Patio Conecta</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="icon" href="./icons/icon-32.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#f6f3f8;color:#291632}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
.card{width:min(720px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 18px 55px rgba(60,25,75,.14)}.brand{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.brand img{width:86px;height:86px;border-radius:20px}h1{margin:0;color:#5b168d;font-size:31px}.sub{margin:5px 0;color:#756b7a}.lead{color:#5f5664;line-height:1.55}
label{display:block;font-size:14px;font-weight:700;margin:13px 0 6px}input{width:100%;padding:14px;border:1px solid #d8cddd;border-radius:12px;font-size:16px}
button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.primary{background:#5b168d;color:white}.open{background:#ef3340;color:white}.secondary{background:#f2eaf6;color:#5b168d;border:1px solid #e2d3e9}
.hidden{display:none!important}.error{display:none;color:#b42318;margin-top:10px}.error.show{display:block}.actions{display:grid;gap:12px;margin-top:20px}
.status{margin-top:16px;padding:15px;border-radius:14px;background:#faf8fb;line-height:1.55}.back{margin-top:14px;background:white;color:#5b168d;border:1px solid #d9cce0}
@media(max-width:560px){.card{padding:22px 18px}.brand img{width:70px;height:70px}h1{font-size:27px}}
</style></head><body><div class="wrap">
<section id="login" class="card"><div class="brand"><img src="./icons/icon-192.png"><div><h1>Ingreso Operadores</h1><p class="sub">Patio Conecta</p></div></div>
<p class="lead">Ingresa el nombre del local y la clave.</p><form id="form"><label>Local</label><input id="local" required><label>Clave</label><input id="clave" type="password" required>
<button class="primary" type="submit" style="margin-top:18px">Ingresar</button><div id="err" class="error">Local o clave incorrectos.</div></form></section>
<section id="portal" class="card hidden"><div class="brand"><img src="./icons/icon-192.png"><div><h1>Patio Conecta</h1><p class="sub">Acceso Operadores · Santiago</p></div></div>
<div class="actions"><a class="btn open" href="https://script.google.com/macros/s/AKfycbyGblqiV68dcWTPXopvJDbDJJYgpizVYq0InCan8NWu3h99pSyo_NoqebB_xtQavNKYGQ/exec">Abrir Patio Conecta</a><button id="installBtn" class="primary hidden">Instalar Patio Conecta en este equipo</button>
<button id="iosBtn" class="secondary hidden">Agregar Patio Conecta en iPhone / iPad</button><button id="manualBtn" class="secondary hidden">Ver cómo instalar en este equipo</button></div>
<div id="status" class="status"><strong>Comprobando instalación…</strong><br>Patio Conecta adaptará las instrucciones al navegador que estés usando.</div>
<button id="logout" class="back">Cerrar acceso</button></section></div>
<script>
const q=s=>document.querySelector(s);let dp=null;
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isAndroid(){return /android/i.test(navigator.userAgent)} function isWindows(){return /windows/i.test(navigator.userAgent)} function isMac(){return /macintosh|mac os x/i.test(navigator.userAgent)&&!isIOS()}
function browser(){const u=navigator.userAgent;if(/CriOS/i.test(u))return'Chrome';if(/FxiOS/i.test(u))return'Firefox';if(/EdgiOS/i.test(u))return'Edge';if(/Safari/i.test(u)&&!/CriOS|FxiOS|EdgiOS/i.test(u))return'Safari';if(/Edg/i.test(u))return'Edge';if(/Chrome/i.test(u))return'Chrome';if(/Firefox/i.test(u))return'Firefox';return'tu navegador'}
q('#form').onsubmit=e=>{e.preventDefault();if(q('#local').value.trim().toLowerCase()==='santiago'&&q('#clave').value.trim().toLowerCase()==='santiago'){q('#login').classList.add('hidden');q('#portal').classList.remove('hidden');refresh()}else q('#err').classList.add('show')};
q('#logout').onclick=()=>{q('#portal').classList.add('hidden');q('#login').classList.remove('hidden')};addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;refresh()});
function refresh(){q('#installBtn').classList.add('hidden');q('#iosBtn').classList.add('hidden');q('#manualBtn').classList.add('hidden');if(dp){q('#installBtn').classList.remove('hidden');q('#status').innerHTML='<strong>Instalación directa disponible.</strong><br>Pulsa el botón de instalación.';return}if(isIOS()){q('#iosBtn').classList.remove('hidden');q('#status').innerHTML='<strong>'+browser()+' en iPhone/iPad.</strong><br>El sistema de Apple exige confirmar manualmente “Agregar a pantalla de inicio”.';return}q('#manualBtn').classList.remove('hidden');q('#status').innerHTML='<strong>Instalación directa no disponible en '+browser()+'.</strong><br>Usa “Ver cómo instalar en este equipo”.'}
q('#installBtn').onclick=async()=>{if(!dp)return refresh();dp.prompt();await dp.userChoice;dp=null};
q('#iosBtn').onclick=()=>{const b=browser();q('#status').innerHTML='<strong>'+b+' en iPhone/iPad</strong><br>1. Abre el menú <strong>Compartir</strong> de '+b+'.<br>2. Elige <strong>Agregar a pantalla de inicio</strong>.<br>3. Confirma <strong>Agregar</strong>.<br><br>Patio Conecta quedará en tu pantalla de inicio con su propio ícono.'};
q('#manualBtn').onclick=()=>{const b=browser();if(isWindows())q('#status').innerHTML='<strong>Windows · '+b+'</strong><br>Usa Instalar aplicación / Instalar página como app.';else if(isMac())q('#status').innerHTML='<strong>Mac · '+b+'</strong><br>Usa Instalar página como app.';else if(isAndroid())q('#status').innerHTML='<strong>Android · '+b+'</strong><br>Usa Instalar app / Agregar a pantalla principal.';else q('#status').innerHTML='<strong>'+b+'</strong><br>Usa la opción de instalar o agregar aplicación disponible.'};
if('serviceWorker'in navigator)addEventListener('load',async()=>{try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready}catch(e){}setTimeout(refresh,500)});else setTimeout(refresh,300);
</script></body></html>
